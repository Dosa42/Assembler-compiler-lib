[package]
name = "uagl_aarch64_assembler"
description = "UAGL v3 -> AArch64 GNU-assembler compiler (faithful Rust port of aarch64_assembler_braille.py)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "uagl_aarch64_assembler"
path = "src/lib.rs"

[dependencies]
regex = "1"
once_cell = "1"
sha2 = "0.10"
base64 = "0.22"
serde_json = "1"
