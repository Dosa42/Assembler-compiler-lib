name: Build Rust and WebAssembly ARM64 executables

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-rust-wasm-arm64.yml
      - .github/scripts/build-rust-wasm.py
      - sources/rust/**
      - sources/rustup/**
      - sources/wasm-tools/**
      - sources/wabt/**
      - sources/binaryen/**
      - sources/wasi-sdk/**
      - sources/emscripten/**
      - sources/emsdk/**
  workflow_dispatch:
    inputs:
      component:
        description: Component to build
        type: choice
        default: all
        options: [all, rust, rustup, wasm-tools, wabt, binaryen, wasi-sdk, emscripten, emsdk]
  workflow_call:
    inputs:
      component:
        type: string
        default: all
        required: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04-arm
    outputs:
      components: ${{ steps.select.outputs.components }}
    steps:
      - name: Select components
        id: select
        env:
          REQUESTED_COMPONENT: ${{ inputs.component || 'all' }}
        run: |
          python3 - <<'PY'
          import json
          import os

          components = ['rust', 'rustup', 'wasm-tools', 'wabt', 'binaryen', 'wasi-sdk', 'emscripten', 'emsdk']
          selected = os.environ['REQUESTED_COMPONENT']
          if selected != 'all':
              if selected not in components:
                  raise ValueError(selected)
              components = [selected]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('components=' + json.dumps(components) + '\n')
          PY

  build:
    needs: plan
    name: Build ${{ matrix.component }} for ARM64
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        component: ${{ fromJSON(needs.plan.outputs.components) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      COMPONENT: ${{ matrix.component }}
      CMAKE_BUILD_PARALLEL_LEVEL: '3'
      CARGO_BUILD_JOBS: '3'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Check out imported source and build script
        uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: |
            .github/scripts
            sources/${{ matrix.component }}
            sources/emsdk
            sources/upstreams.json

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential clang lld cmake ninja-build pkg-config curl ca-certificates python3 python3-venv nodejs npm libssl-dev zlib1g-dev libzstd-dev libxml2-dev libedit-dev libncurses-dev autoconf automake libtool texinfo
          test "$(uname -m)" = aarch64

      - name: Install Rust bootstrap tools for Cargo projects
        if: contains(fromJSON('["rustup", "wasm-tools", "wasi-sdk"]'), matrix.component)
        run: |
          curl --fail --silent --show-error --location https://sh.rustup.rs -o "$RUNNER_TEMP/rustup-bootstrap.sh"
          sh "$RUNNER_TEMP/rustup-bootstrap.sh" -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Compile, install, execute checks and package
        run: python3 .github/scripts/build-rust-wasm.py

      - name: Upload verified executables and libraries
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.component }}-ubuntu-24.04-arm64
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Preserve installed files if verification fails
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.component }}-unverified-stage
          path: stage/
          if-no-files-found: ignore
          compression-level: 1
          retention-days: 3

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.component }}-build-logs
          path: |
            build-logs/
            build/**/CMakeCache.txt
            build/**/bootstrap.toml
          if-no-files-found: ignore
          retention-days: 14
