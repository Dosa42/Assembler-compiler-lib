name: Import LLVM and Zig source repositories

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-llvm-zig.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-llvm-zig-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    name: Clone LLVM and Zig into the repository
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out destination repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - name: Clone official sources and verify complete Git trees
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess

          root = Path(os.environ['GITHUB_WORKSPACE'])
          scratch = Path(os.environ['RUNNER_TEMP']) / 'llvm-zig-import'
          scratch.mkdir(parents=True, exist_ok=True)
          manifest_path = root / 'sources/upstreams.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          repositories = [
              ('llvm-project', 'https://github.com/llvm/llvm-project.git', ['LLVM', 'Clang', 'LLD', 'LLDB', 'MLIR', 'Flang', 'Compiler-RT', 'libc', 'libc++', 'libc++abi', 'libunwind', 'OpenMP']),
              ('zig', 'https://codeberg.org/ziglang/zig.git', ['Zig']),
          ]
          additions = []
          for name, url, components in repositories:
              relative = 'sources/' + name
              destination = root / relative
              record = next((item for item in manifest['repositories'] if item['path'] == relative), None)
              if destination.exists():
                  if record is None:
                      raise RuntimeError('Source directory exists without an upstream record: ' + relative)
                  print(relative + ' is already imported at ' + record['commit'], flush=True)
                  continue
              clone = scratch / name
              print('Cloning ' + url, flush=True)
              subprocess.run(['git', 'clone', '--no-checkout', '--depth=1', '--single-branch', url, str(clone)], check=True)
              commit = subprocess.check_output(['git', '-C', str(clone), 'rev-parse', 'HEAD'], text=True).strip()
              branch = subprocess.check_output(['git', '-C', str(clone), 'symbolic-ref', '--short', 'HEAD'], text=True).strip()
              upstream_tree = subprocess.check_output(['git', '-C', str(clone), 'rev-parse', 'HEAD^{tree}'], text=True).strip()
              files = subprocess.check_output(['git', '-C', str(clone), 'ls-tree', '-r', '--name-only', '-z', 'HEAD'])
              file_count = len([path for path in files.split(b'\0') if path])
              destination.mkdir(parents=True)
              subprocess.run(['git', '--git-dir=' + str(clone / '.git'), '--work-tree=' + str(destination), 'checkout', '--force', 'HEAD', '--', '.'], cwd=destination, check=True)
              subprocess.run(['git', '-C', str(root), 'add', '--force', '--', relative], check=True)
              staged_root = subprocess.check_output(['git', '-C', str(root), 'write-tree'], text=True).strip()
              imported_tree = subprocess.check_output(['git', '-C', str(root), 'rev-parse', staged_root + ':' + relative], text=True).strip()
              if imported_tree != upstream_tree:
                  raise RuntimeError('Imported source tree differs from upstream: ' + relative)
              record = {'path': relative, 'url': url, 'branch': branch, 'commit': commit, 'tree': upstream_tree, 'file_count': file_count, 'components': components, 'imported_at': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'verification': 'Imported Git tree SHA matches upstream Git tree SHA'}
              if record['path'] == 'sources/llvm-project':
                  for required in ['llvm', 'clang', 'lld', 'lldb', 'mlir']:
                      if not (destination / required).is_dir():
                          raise RuntimeError('LLVM subproject missing: ' + required)
              if record['path'] == 'sources/zig':
                  for required in ['src', 'lib', 'build.zig', 'LICENSE']:
                      if not (destination / required).exists():
                          raise RuntimeError('Zig source file or directory missing: ' + required)
              manifest['repositories'].append(record)
              additions.append(record)
              shutil.rmtree(clone)
              print(name + ': ' + str(file_count) + ' files; verified tree ' + upstream_tree + '; commit ' + commit, flush=True)
          if additions:
              manifest['updated_at'] = datetime.datetime.now(datetime.timezone.utc).isoformat()
              manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
              subprocess.run(['git', '-C', str(root), 'add', '--force', '--', 'sources/upstreams.json'], check=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('LLVM and Zig source import\n\n| Source | Commit | Files | Verification |\n| --- | --- | --- | --- |\n')
              for record in manifest['repositories']:
                  if record['path'] in ['sources/llvm-project', 'sources/zig']:
                      summary.write('| ' + record['path'] + ' | ' + record['commit'] + ' | ' + str(record['file_count']) + ' | Matching upstream Git tree |\n')
          PY

      - name: Commit and push imported source trees
        run: |
          if git diff --cached --quiet; then
            echo 'LLVM and Zig sources are already imported.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit --quiet -m 'Import official LLVM monorepo and Zig sources with verified Git trees'
            git -c pack.threads=2 -c pack.windowMemory=128m push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          fi
